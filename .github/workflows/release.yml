name: atriumdb_release
'on':
  push:
    branches: [release-step-test]
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: Release Version
        required: true
        type: string
      pypiReleaseFeed:
        description: PyPI Release Feed
        required: true
        type: choice
        options:
        - test.pypi
        - pypi
        default: test.pypi
        
permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-wheels.yml

  github-release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Retrieve release distributions
      uses: actions/download-artifact@v5
      with:
        pattern: dist-*
        merge-multiple: true
        path: dist

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.releaseVersion || '2.7.0.dev1' }}
      run: gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --notes ""
        
